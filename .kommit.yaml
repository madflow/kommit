# Kommit Configuration Example - Conventional Commits
# Place this file in one of these locations:
# - $PWD/.kommit.yaml
# - $GIT_DIR/.konfig.yaml (if in a git repository)
# - $XDG_CONFIG_HOME/kommit/config.yaml
# - $HOME/.config/kommit/config.yaml
# - $HOME/.kommit.yaml

# Ollama API configuration
ollama:
  # URL of the Ollama API server
  server_url: "http://localhost:11434/api/generate"
  # Model to use for generating commit messages
  model: "qwen2.5-coder:7b"

# Rules for generating conventional commit messages
rules: |
  Follow the Conventional Commits specification (https://www.conventionalcommits.org/)
  
  Format: <type>[optional scope]: <description>
  [optional body]
  [optional footer(s)]
  
  Types:
  - feat: A new feature
  - fix: A bug fix
  - docs: Documentation only changes (when only the README.md has been changed)
  - style: Changes that do not affect the meaning of the code (white-space, formatting, etc)
  - refactor: A code change that neither fixes a bug nor adds a feature
  - perf: A code change that improves performance
  - test: Adding missing tests or correcting existing tests
  - chore: Changes to the build process or auxiliary tools and libraries

  Rules:
  1. Use the imperative, present tense ("add feature" not "added feature")
  2. Do not capitalize the first letter of the description
  3. No dot (.) at the end of the description
  4. Keep the subject line under 80 characters
  5. Consider starting the commit message after the <scope>: part with an applicable emoji
  6. When only the README.md has been changed, use the "docs" type
  7. When only changes in .github folder have been made, use the "chore" type
  8. Prefer the "fix" type over the "refactor" type
  9. Important: When the current "branch name" on the Repository context is in the format <type>/<scope> the commit type should always be this type.  
  10. Use the english language at all time

  Example for a branch name rule:
  - The branch name is chore/docs-update
  - The commit type should be: "chore(docs): update documentation"

  General Examples:
  feat(auth): add login functionality
  
  - Implement JWT token generation on successful login
  - Add login form validation
  - Update authentication middleware

  docs(readme):📚 updated usage instructions
  
  - Updated instrcutions on how to use the application
  - Added usage examples
  
  Emoji Reference:
  ✨ feat: New feature
  🐛 fix: Bug fix
  📚 docs: Documentation
  💄 style: Code style
  ♻️ refactor: Code refactoring
  ⚡ perf: Performance improvements
  ✅ test: Adding tests
  🔧 chore: Maintenance

# Rules for generating pull request descriptions
pr_rules: |
  Expected output format:

  ---
  ## Summary
  <1-3 bullet points>
  ---

  Do not deviate from this format.

  - Create a concise summary for a pull request in the format "## Summary" followed by 1-3 bullet points.
  - Each bullet point should highlight a key change or improvement made in this pull request.
  - Focus on the value and impact of the changes, not just what files were modified.
  - Write in plain text only - no bold, italic, or code formatting except for the ## Summary header.
  - Use simple, direct language that explains what was accomplished.
  - Be specific about features added, bugs fixed, or improvements made.
  - Avoid generic descriptions like "updated files" or "made changes".
  - Keep bullet points concise but informative (aim for 1-2 lines each).
  - Use the past tense for describing what was accomplished in this pull request.
  - Focus on the user-facing or developer-facing benefits of the changes.

# Rules for generating pull request titles
pr_title_rules: |
  - Create a concise and descriptive pull request title.
  - Maximum length: 80 characters (aim for under 80 characters).
  - Use imperative mood ("Add feature" not "Added feature" or "Adds feature").
  - Start with a verb when possible (Add, Fix, Update, Remove, etc.).
  - Be specific about what was changed or accomplished.
  - Do not use conventional commit prefixes (feat:, fix:, etc.) unless explicitly requested.
  - Avoid articles (a, an, the) when possible to save space.
  - Do not end with a period.
  - Focus on the primary change or most important aspect.
  - Use title case for the first word only.
  - Examples: "Add user authentication system", "Fix memory leak in parser", "Update API documentation".
