# Kommit Configuration Example - Conventional Commits
# Place this file in one of these locations:
# - $PWD/.kommit.yaml
# - $GIT_DIR/.konfig.yaml (if in a git repository)
# - $XDG_CONFIG_HOME/kommit/config.yaml
# - $HOME/.config/kommit/config.yaml
# - $HOME/.kommit.yaml

providers:
  ollama:
    name: "Ollama"
    base_url: "http://localhost:11434/v1/"
    type: "openai-compat"
    models:
      - name: "Qwen 2.5 Coder 7B"
        id: "qwen2.5-coder:7b"
        context_window: 32768
        default_max_tokens: 4096

# Optional: set default provider/model (if not set, first provider/model is used)
default_provider: "ollama"
default_model: "qwen2.5-coder:7b"

# Rules for generating conventional commit messages
rules: |
  Follow the Conventional Commits specification (https://www.conventionalcommits.org/)
  
  Format: <type>[optional scope]: <description>
  [optional body]
  [optional footer(s)]
  
  Types:
  - feat: A new feature
  - fix: A bug fix
  - docs: Documentation only changes
  - style: Changes that do not affect the meaning of the code (white-space, formatting, etc)
  - refactor: A code change that neither fixes a bug nor adds a feature
  - perf: A code change that improves performance
  - test: Adding missing tests or correcting existing tests
  - chore: Changes to the build process or auxiliary tools and libraries
  
  Rules:
  1. Use the imperative, present tense ("add feature" not "added feature")
  2. Do not capitalize the first letter of the description
  3. No dot (.) at the end of the description
  4. Keep the subject line under 72 characters
  5. Reference issues and pull requests in the footer when applicable
  6. Consider starting the commit message with an applicable emoji
  
  Example:
  feat(auth): add login functionality
  
  - Implement JWT token generation on successful login
  - Add login form validation
  - Update authentication middleware
  
  Closes #123
  
  Emoji Reference:
  ✨ feat: New feature
  🐛 fix: Bug fix
  📚 docs: Documentation
  💄 style: Code style
  ♻️ refactor: Code refactoring
  ⚡ perf: Performance improvements
  ✅ test: Adding tests
  🔧 chore: Maintenance

# Rules for generating pull request descriptions (conventional style)
pr_rules: |
  Expected output format:

  ---
  ## Summary
  <1-3 bullet points>
  ---

  Do not deviate from this format.

  - Create a professional summary for a pull request in the format "## Summary" followed by 1-3 bullet points.
  - Each bullet point should highlight a key change or improvement made in this pull request.
  - Focus on the business value and technical impact of the changes, not just what files were modified.
  - Write in plain text only - no bold, italic, or code formatting except for the ## Summary header.
  - Use clear, professional language that explains what was accomplished.
  - Be specific about features added, bugs fixed, or improvements made.
  - Follow conventional commit types when describing changes (feat, fix, docs, style, refactor, perf, test, chore).
  - Avoid generic descriptions like "updated files" or "made changes".
  - Keep bullet points concise but informative (aim for 1-2 lines each).
  - Use the past tense for describing what was accomplished in this pull request.
  - Focus on the user-facing or developer-facing benefits of the changes.
  - Reference relevant issues or tickets when applicable.

# Rules for generating pull request titles (conventional style)
pr_title_rules: |
  Expected output format:
  
  ---
  Brief descriptive title
  ---
  
  Do not deviate from this format.
  
  - Create a clear and descriptive pull request title following conventional commit style.
  - Maximum length: 72 characters (following conventional commit guidelines).
  - Use conventional commit prefixes when appropriate (feat:, fix:, docs:, style:, refactor:, perf:, test:, chore:).
  - Use imperative mood ("Add feature" not "Added feature" or "Adds feature").
  - Be specific about what was changed or accomplished.
  - Include scope in parentheses when relevant (e.g., "feat(auth): add login system").
  - Do not end with a period.
  - Focus on the primary change or most important aspect.
  - Use lowercase for the description part (following conventional commits).
  - Examples: "feat(auth): add user authentication system", "fix(parser): resolve memory leak", "docs: update API documentation".